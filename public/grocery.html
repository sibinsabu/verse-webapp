<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List</title>
    <link rel="stylesheet" href="grocery.css">
</head>
<body>
    <div class="container">
        <h1>Grocery List</h1>
        <form id="grocery-form">
            <input type="text" id="grocery-item" placeholder="Enter grocery item" required>
            <button type="submit">Add Item</button>
        </form>
        <ul id="grocery-list"></ul>
        <a href="dashboard.html" class="back-btn">Back to Dashboard</a>
    </div>

    <script>
        document.getElementById("grocery-form").addEventListener("submit", async function(event) {
            event.preventDefault();
            const item = document.getElementById("grocery-item").value;

            const response = await fetch("/add-grocery", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ item })
            });

            if (response.ok) {
                const newItem = await response.json();
                const listItem = document.createElement("li");
                listItem.textContent = newItem.item;
                document.getElementById("grocery-list").appendChild(listItem);
                document.getElementById("grocery-item").value = ""; // Clear input
            }
        });

        // Fetch and display grocery items
        async function loadGroceries() {
            const response = await fetch("/get-groceries");
            const groceries = await response.json();
            const list = document.getElementById("grocery-list");
            groceries.forEach(item => {
                const listItem = document.createElement("li");
                listItem.textContent = item.item;
                list.appendChild(listItem);
            });
        }

        window.onload = loadGroceries;
    </script>
</body>
</html>
